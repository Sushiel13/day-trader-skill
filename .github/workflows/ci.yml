name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Byte-compile every tool and test
        run: python -m compileall -q trader-* tests

      - name: Validate JSON files
        run: |
          set -euo pipefail
          find . -path ./.git -prune -o -name '*.json' -print0 \
            | xargs -0 -n1 python -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))'
          echo "All JSON files parse."

      - name: Check every skill folder has a SKILL.md with frontmatter
        run: |
          set -euo pipefail
          for d in trader-*/; do
            f="${d}SKILL.md"
            test -f "$f" || { echo "::error file=$d::missing SKILL.md"; exit 1; }
            head -1 "$f" | grep -qx -- '---' || { echo "::error file=$f::no frontmatter"; exit 1; }
          done
          echo "All skill folders look good."

      - name: Ruff (pyflakes rules, Python 3.8 target)
        # F811 is off: scan.py defines confirm() conditionally on purpose (None when offline)
        run: |
          pip install --quiet ruff
          ruff check --no-cache --select F --ignore F811 --target-version py38 trader-* tests

  test:
    name: Tests (Python ${{ matrix.python }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # README promises 3.8+; 3.8 is no longer built for ubuntu-24.04, so pin 22.04 for it
          - { python: "3.8", os: ubuntu-22.04 }
          - { python: "3.10", os: ubuntu-latest }
          - { python: "3.12", os: ubuntu-latest }
          - { python: "3.13", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run unit tests
        env:
          SEC_USER_AGENT: "CI day-trader-skill ci@example.com"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -t tests -v

  release:
    name: Package and release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches plugin.json version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag v$tag does not match plugin.json version $ver"
            exit 1
          fi

      - name: Build skill bundle
        run: |
          set -euo pipefail
          name="day-trader-skill-${GITHUB_REF_NAME}"
          mkdir -p "dist/$name"
          cp -r trader-* .claude-plugin README.md LICENSE "dist/$name/"
          (cd dist && zip -qr "$name.zip" "$name")
          (cd dist && sha256sum "$name.zip" > "$name.zip.sha256")
          ls -l dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes
